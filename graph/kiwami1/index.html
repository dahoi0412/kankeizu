    <h1>龍が如く 極 関係図</h1>
    <div class="meta">イベント13件。一度きりの相手は消える。緑は近づき、赤は対立、破線は混在または死。</div>
    <select id="pick"><option value="0">01 セレナで桐生組の話。錦が堂島を嘲り、桐生が「控えろ錦」と止める</option>
<option value="1">02 堂島が由美をさらったと聞き、錦が一人で組長の事務所へ向かう</option>
<option value="2">03 錦が堂島を撃つ。桐生は由美を連れて逃げろと言い、現場に残る</option>
<option value="3">04 伊達は、誰かをかばっていると言う。桐生は風間へ指輪を託す</option>
<option value="4">05 出所した桐生は、風間がすでに殺されていることを知る</option>
<option value="5">06 真司が、錦山組の若頭になったことと、錦はもう昔の人ではないと伝える</option>
<option value="6">07 真島が、出所した桐生の前に繰り返し現れる</option>
<option value="7">08 桐生は、由美の娘・遥と出会う</option>
<option value="8">09 セレナで10年ぶりに飲む。錦は兄弟と呼び、面会に行かなくて悪かったと言う</option>
<option value="9">10 錦は風間を討ったと認め、遥を渡せと言う。今日限り兄弟じゃねえ</option>
<option value="10">11 ミレニアムタワーで由美が死ぬ。遥が残される</option>
<option value="11">12 屋上で錦は運命を変えると言い、桐生は逃げられないと言う。決着をつけよう</option>
<option value="12">13 伊達の前で、由美も錦も風間も、もうみんないないと言う</option></select>
    <div style="margin-top:8px"><input id="slider" type="range" min="0" max="12" value="0"/></div>

    <div class="cast" id="cast"></div>
