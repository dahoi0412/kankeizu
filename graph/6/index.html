    <h1>龍が如く6 関係図</h1>
    <div class="meta">イベント8件。主要な関係の手引き。映像時刻はこれから足します。一度きりの相手は消える。緑は近づき、赤は対立、破線は混在または死。</div>
    <select id="pick"><option value="0">01 遥が事故に遭い、桐生は孫の存在を知る</option>
<option value="1">02 桐生が、春人を連れて広島へ向かう</option>
<option value="2">03 春人の父親・勇太が、桐生の前に出る</option>
<option value="3">04 桐生が、広島の小さな一家の客分になる</option>
<option value="4">05 勇太の出自が、岩見側の事情と結びつく</option>
<option value="5">06 桐生が、勇太を遥と春人の側に置く</option>
<option value="6">07 岩見との戦いのあと、桐生は家族の前から消える</option>
<option value="7">08 桐生は、春人たちの前では死んだことになる</option></select>
    <div style="margin-top:8px"><input id="slider" type="range" min="0" max="7" value="0"/></div>
