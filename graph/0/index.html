    <h1>龍が如く0 関係図 第1版</h1>
    <div class="meta">イベント40件。下書き。一度きりの相手は消える。緑は近づき、赤は対立、破線は混在または死。</div>
    <select id="pick"><option value="0">01 待ち合わせで再会し、飲みに誘う</option>
<option value="1">02 昨夜の取り立て相手が死体で見つかり、桐生に疑いがかかる</option>
<option value="2">03 久瀬が桐生を呼び出し、空き地の死体を追及する</option>
<option value="3">04 空の一坪を堂島に献上した者が次期若頭になる、と明かす</option>
<option value="4">05 空の一坪争いに風間が巻き込まれたと知り、おやっさんを守ろうとする</option>
<option value="5">06 風間に迷惑をかけぬよう、今日限り堂島組を抜けると決める</option>
<option value="6">07 錦が組抜けを止め、車を出せと頼まれる</option>
<option value="7">08 風間についていくために極道になった、と告白して事務所へ向かう</option>
<option value="8">09 錦と桐生が、風間の背中を見て極道を志したと語る</option>
<option value="9">10 組を抜けたなら兄貴分ではない、と久瀬側が襲う。桐生は久瀬に直接向かう</option>
<option value="10">11 組長の前で殺しを否定し、組に迷惑をかけぬよう破門を願い出る</option>
<option value="11">12 久瀬が「桐生はもう組を抜けた。殺すのにおやじの許しはいらねえ」と切り捨てる</option>
<option value="12">13 雨の中、立華が桐生に近づき「この時を待っていた」と名乗る</option>
<option value="13">14 立華が桐生に近づいたのは、堂島組若頭・風間の推薦だと明かす</option>
<option value="14">15 真島がグランド支配人として客の前に出る。裏では佐川の支配下</option>
<option value="15">16 リーの店で「牧村マコト」を名乗る相手に辿り着く</option>
<option value="16">17 ナレで、濡れ衣を着せたのが久瀬だと明示される</option>
<option value="17">18 錦の行きつけの店で麗奈が桐生と引き合わされる</option>
<option value="18">19 阿波野の前で錦が「こいつとはたまたま。関係ない」と桐生を守る</option>
<option value="19">20 立華を渡さない桐生を、久瀬が始末すると決める</option>
<option value="20">21 久瀬と組むくらいなら撃たれる方がマシだ、と拒絶する</option>
<option value="21">22 錦が車で桐生を神室町から逃がす。「これがお前を助けてやれる最後だ」</option>
<option value="22">23 堂島組の見せしめを恐れ、錦が「人思いに死なせてやる」と銃を向ける</option>
<option value="23">24 撃てず、「おめえが一緒じゃなきゃダメだ」と崩れる</option>
<option value="24">25 神室町に戻ると言い、今日限り兄弟の縁を切る。錦に関わるな</option>
<option value="25">26 極道復帰の条件として、佐川が真島にマコト殺害を命じる。真島は殺意を失う</option>
<option value="26">27 マコトを守り切るために、死体を偽装する必要があると言う</option>
<option value="27">28 久瀬に代わり阿波野が台頭し、立華の身柄を要求して神室町を包囲する</option>
<option value="28">29 近江・貴船会の西谷が真島とマコトの前に出る</option>
<option value="29">30 立華側が、空の一坪の所有者が牧村マコトだと桐生に伝える</option>
<option value="30">31 蒼天堀へ行き、託されたマコトを探すと決める</option>
<option value="31">32 渋澤がマコトを堂島の前に連れてくる</option>
<option value="32">33 ナレで、マコトは立華の生き別れの妹であり、兄は殺されたと明かされる</option>
<option value="33">34 真島はマコトのそばを離れ、堂島と差し違えて終わらせると言う</option>
<option value="34">35 堂島側が風間組の始末を命じ、風間が堂島を裏切ったけじめを取れと言う</option>
<option value="35">36 渋澤が桐生を殺し、風間を越え、堂島の龍になると宣言する</option>
<option value="36">37 本編の二人の線が交差する。桐生が真島の名を呼ぶ</option>
<option value="37">38 風間は堅気に戻れと言ったが、桐生は堂島組復帰をけじめだと選ぶ</option>
<option value="38">39 錦は風間組へ戻れと引き止める。桐生は堂島組に戻ると譲らない</option>
<option value="39">40 復帰後も二人は並んで歩く。白いスーツの話まで戻る</option></select>
