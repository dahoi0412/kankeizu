    <select id="pick"><option value="0">01 桐生は東城会を離れ、遥たちと沖縄で暮らす</option>

<option value="2">03 大吾が襲撃され、桐生は再び東城会へ戻る</option>

<option value="5">06 力也が、桐生を守って死ぬ</option>
<option value="6">07 峯との決着のあと、沖縄の日常へ戻る理由が残る</option>
<option value="7">08 桐生は、遥のいる場所へ戻る</option></select>
