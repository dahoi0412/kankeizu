    <select id="pick"><option value="0">01 桐生は、東城会を守るために名を消す</option>

<option value="2">03 渡瀬と大吾のあいだで、二つの組織の終わりが語られる</option>
<option value="3">04 ハンが、名前を消した男の前に代理人として現れる</option>
<option value="4">05 桐生と朱里が、捨てた名前の代償を共有する</option>
<option value="5">06 東城会と近江連合が、表から消える</option>
<option value="6">07 名を消した男は、春日の時代の外側に残る</option></select>
