    <h1>龍が如く 極2 関係図</h1>
    <div class="meta">イベント8件。主要な関係の手引き。映像時刻はこれから足します。一度きりの相手は消える。緑は近づき、赤は対立、破線は混在または死。</div>
    <select id="pick"><option value="0">01 桐生は東城会を離れようとするが、大吾の危機で動く</option>
<option value="1">02 寺田が襲撃され、東城会と近江連合の抗争が始まる</option>
<option value="2">03 狭山が桐生の捜査に関わり、距離が縮まる</option>
<option value="3">04 郷田龍司が、桐生を自分の対戦相手と認める</option>
<option value="4">05 真島が、極2でも桐生の前に現れる</option>
<option value="5">06 寺田の立場が、東城会の外の事情と結びつく</option>
<option value="6">07 屋上の決着のあと、龍司はもう立たない</option>
<option value="7">08 抗争のあと、桐生は遥のいる日常へ戻ろうとする</option></select>
    <div style="margin-top:8px"><input id="slider" type="range" min="0" max="7" value="0"/></div>
    <div class="caption" id="caption"></div>
    <div class="cast" id="cast"></div>
  </header>
